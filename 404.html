<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | Dr. Esli Silva - Advogado Previdenciário</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <style>
        :root {
            --cor-primaria: #1a2947;
            --cor-secundaria: #d4af37;
            --cor-branco: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--cor-primaria);
            color: var(--cor-branco);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        main {
            max-width: 480px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            margin: 0 auto 2rem;
            display: block;
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            color: var(--cor-secundaria);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        p {
            font-size: 1rem;
            opacity: 0.7;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        a {
            display: inline-block;
            background: var(--cor-secundaria);
            color: var(--cor-primaria);
            padding: 0.9rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        a:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        a:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.6);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <img src="img/logo.png" alt="Dr. Esli Silva - Advogado" class="logo" width="80" height="80">
        <h1>404</h1>
        <h2>Página não encontrada</h2>
        <p>A página que você procura não existe ou foi movida.<br>Volte para o início e encontre o que precisa.</p>
        <a href="/">Voltar ao início</a>
    </main>
</body>
</html>
